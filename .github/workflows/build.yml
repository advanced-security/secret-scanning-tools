name: Run on examples

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Get token
        id: get_workflow_token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2
        with:
          app-id: ${{ secrets.ADVANCED_SECURITY_APP_ID }}
          private-key: ${{ secrets.ADVANCED_SECURITY_APP_KEY }}

      - name: Install dependencies
        run: python3 -m pip install pipenv && python3 -m pipenv install

      # Run Validation
      - name: Run - full example
        env:
          GITHUB_REPOSITORY: advanced-security/secret-scanning-custom-patterns
          GITHUB_TOKEN: ${{ steps.get_workflow_token.outputs.token }}
        run: |
          pipenv run snapshot -p ./examples/
          pipenv run validate -p ./examples/
          pipenv run markdown -p ./examples/ --cwd ./examples/
